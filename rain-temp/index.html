<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      try {
        const savedTheme = localStorage.getItem('rain-temp-theme');
        document.documentElement.dataset.theme = savedTheme === 'dark' ? 'dark' : 'light';
        document.documentElement.style.colorScheme = savedTheme === 'dark' ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
    <meta name="description" content="Kemsor Studios. Production support for films, series and documentaries, from the first idea to the finished frame." />
    <title>Kemsor Studios — Let’s make a scene.</title>
    <link rel="icon" href="/assets/kemsor-logo.webp" type="image/webp" />
    <link rel="preload" href="/assets/fonts/manrope.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/assets/hero-films/studio-intro.jpg" as="image" fetchpriority="high" />
  </head>
  <body data-page="home">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
