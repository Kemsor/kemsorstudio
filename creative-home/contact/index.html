<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      try {
        const savedTheme = localStorage.getItem('kemsor-creative-theme');
        document.documentElement.dataset.theme = savedTheme === 'dark' ? 'dark' : 'light';
        document.documentElement.style.colorScheme = savedTheme === 'dark' ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
    <meta name="description" content="Prepare your project brief and find a starting point for working with Kemsor Studios." />
    <title>Start a project — Kemsor Studios</title>
    <link rel="icon" href="/assets/kemsor-logo.webp" type="image/webp" />
    <link rel="preload" href="/assets/fonts/space-grotesk.ttf" as="font" type="font/ttf" crossorigin />
  </head>
  <body data-page="contact">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
